services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_local_only
      MYSQL_DATABASE: ticketing_db
      MYSQL_USER: ticketing
      MYSQL_PASSWORD: ticketing
    ports:
      - "3306:3306"      
    volumes:
      - mysqldata_local:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "ticketing", "-pticketing"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s 

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    volumes:
      - .:/app          
    depends_on:
      db:
        condition: service_healthy
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

volumes:
  mysqldata_local:
