# /etc/nginx/sites-available/ticketing-api
# Habilitar con: sudo ln -s /etc/nginx/sites-available/ticketing-api /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name tu-dominio.com;   # o la IP pública de la VM

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Después de validar que funciona en HTTP, agrega TLS con:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d tu-dominio.com
# Certbot reescribe este bloque automáticamente para servir HTTPS.
