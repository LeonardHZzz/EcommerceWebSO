<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crear cuenta — YumeEvent</title>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<div id="site-header"></div>

<main class="auth-page">
  <div class="auth-card">
    <h1 id="auth-title">Crea tu cuenta</h1>
    <p class="subtitle" id="auth-subtitle">Completa tus datos para empezar a comprar tus entradas.</p>

    <div class="form-error" id="auth-error"></div>

    <form id="auth-form">
      <div id="extra-fields">
        <div class="field">
          <label for="auth-nombre">Nombre</label>
          <input type="text" id="auth-nombre" class="register-only" required>
        </div>
        <div class="field">
          <label for="auth-apellido">Apellido</label>
          <input type="text" id="auth-apellido" class="register-only" required>
        </div>
      </div>

      <div class="field">
        <label for="auth-email">Correo electrónico</label>
        <input type="email" id="auth-email" required autocomplete="username">
      </div>

      <div class="field">
        <label for="auth-password">Contraseña</label>
        <input type="password" id="auth-password" required minlength="6" autocomplete="current-password">
      </div>

      <div class="field" id="telefono-field">
        <label for="auth-telefono">Teléfono (opcional)</label>
        <input type="text" id="auth-telefono" autocomplete="tel">
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Registrarme</button>
    </form>

    <p class="drawer-switch">
      <a href="#" id="toggle-link">¿Ya tienes cuenta? Inicia sesión aquí</a>
    </p>
  </div>
</main>

<div id="site-footer"></div>

<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/auth-page.js"></script>
</body>
</html>
